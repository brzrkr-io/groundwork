# Task 2: the namespace shop is moving to the "restricted" Pod Security
# Standard. kubectl apply already warns:
#
#   Warning: would violate PodSecurity "restricted:latest":
#   allowPrivilegeEscalation != false (container "api" must set
#   securityContext.allowPrivilegeEscalation=false), unrestricted
#   capabilities (container "api" must set
#   securityContext.capabilities.drop=["ALL"]), runAsNonRoot != true (pod
#   or container "api" must set securityContext.runAsNonRoot=true),
#   seccompProfile (pod or container "api" must set
#   securityContext.seccompProfile.type to "RuntimeDefault" or "Localhost")
#
# TODO(2): Add security contexts so api passes. podinfo's user is UID 100.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          ports:
            - name: http
              containerPort: 9898
