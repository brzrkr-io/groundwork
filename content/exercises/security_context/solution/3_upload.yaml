# Task 3: a read-only image, with one writable scratch folder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upload
  template:
    metadata:
      labels:
        app: upload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {} # empty when the Pod starts, deleted with the Pod
      containers:
        - name: upload
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          # podinfo stores uploads (POST /store) in --data-path.
          command: ["./podinfo", "--data-path=/tmp"]
          ports:
            - name: http
              containerPort: 9898
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
