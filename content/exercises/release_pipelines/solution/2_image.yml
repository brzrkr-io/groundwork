# Task 2: build the statusd image and push it to GitHub's container
# registry, tagged with the version.
# In a real repository: .github/workflows/image.yml.

name: image

on:
  push:
    tags: ['v*.*.*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/acme/statusd:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
