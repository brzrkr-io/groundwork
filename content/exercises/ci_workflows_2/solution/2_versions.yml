# Task 2: backupd still supports Go 1.20 for one old customer, so CI tests
# it on that version and on the current one.
# In a real repository: .github/workflows/backupd.yml.

name: backupd

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.20', '1.26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
