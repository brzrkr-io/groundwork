# What `kubectl get deployments,services -n kube-system -o yaml` prints: one
# document of kind List, with the objects under items.
apiVersion: v1
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      k8s-app: kube-dns
    name: coredns
    namespace: kube-system
  spec:
    replicas: 2
    selector:
      matchLabels:
        k8s-app: kube-dns
    template:
      metadata:
        labels:
          k8s-app: kube-dns
      spec:
        containers:
        - args: ["-conf", "/etc/coredns/Corefile"]
          image: registry.k8s.io/coredns/coredns:v1.12.0
          livenessProbe:
            httpGet: {path: /health, port: 8080}
          name: coredns
          readinessProbe:
            httpGet: {path: /ready, port: 8181}
          resources:
            limits: {memory: 170Mi}
            requests: {cpu: 100m, memory: 70Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
- apiVersion: v1
  kind: Service
  metadata:
    name: kube-dns
    namespace: kube-system
  spec:
    ports:
    - name: dns
      port: 53
      protocol: UDP
kind: List
metadata:
  resourceVersion: ""
