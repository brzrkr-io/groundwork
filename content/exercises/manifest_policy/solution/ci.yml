# Tests kubepolicy, then checks the deploy/ manifests with it, on pushes to
# main and on every pull request.
# In your GitHub repository this file lives at .github/workflows/ci.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  policy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o bin/kubepolicy ./cmd/kubepolicy
      - name: Check the raw manifests
        run: bin/kubepolicy deploy/base
      - name: Check what production really gets
        shell: bash # adds pipefail: a failing kustomize fails the step
        run: kubectl kustomize deploy/overlays/production | bin/kubepolicy -
