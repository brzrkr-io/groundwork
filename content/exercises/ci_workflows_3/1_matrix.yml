# Task 1: inventory ships for Linux and macOS, and must build with both Go
# releases the Go team supports.
# In a real repository: .github/workflows/test.yml.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # TODO(1): Run this job four times: on Go 1.26 and Go 1.27, each on Linux
    # and on macOS. One failing copy must not cancel the other three.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
