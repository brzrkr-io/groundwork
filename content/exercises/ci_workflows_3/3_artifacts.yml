# Task 3: build statusd once, then smoke-test that very binary in a second
# job. In a real repository: .github/workflows/ci.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o bin/statusd .
      # TODO(3): Upload bin/statusd as the artifact "statusd". Then add a job
      # "smoke" that waits for build, downloads the artifact and runs it.
