# Task 3: build statusd, but only once the tests pass.
# In a real repository: .github/workflows/ci.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # TODO(3): Add the job "build". It needs test, and builds bin/statusd.
