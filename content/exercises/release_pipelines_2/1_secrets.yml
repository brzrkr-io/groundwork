# Task 1: deploy statusd to production after every push to main.
# In a real repository: .github/workflows/deploy.yml.

name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # TODO(1): The review found the deploy token in plain text in this
    # file, and printed in the build log of every run.
    env:
      DEPLOY_TOKEN: ghp_R3leas3Pipel1neExampleT0kenD0NotUse
    steps:
      - uses: actions/checkout@v7
      - name: Show which token we use
        run: echo "using $DEPLOY_TOKEN"
      - run: ./deploy.sh production
