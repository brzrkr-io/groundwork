# Task 2: test statusd, then push its image, for every version tag.
# In a real repository: .github/workflows/release.yml.

name: release

on:
  push:
    tags: ['v*']

# TODO(2): The review found that every job's token may push code, edit
# releases and change settings, though no job does any of that.
permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/acme/statusd:${{ github.ref_name }}
