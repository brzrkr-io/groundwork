# Task 1: deploy statusd to production after every push to main.
# In a real repository: .github/workflows/deploy.yml.

name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: ./deploy.sh production
