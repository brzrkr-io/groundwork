# Task 3: ship alertd, the team's second service: build its image once,
# deploy it to staging, then promote the same image to production.
# In a real repository: .github/workflows/deliver.yml.

name: deliver

on:
  push:
    tags: ['v*.*.*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/acme/alertd:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}

  # TODO(3): Add the job "deploy-staging": after image, deploy this version
  # to the staging environment with deploy.sh.

  # TODO(3): Add the job "deploy-production": after staging, deploy the same
  # version to production, one production deploy at a time.
