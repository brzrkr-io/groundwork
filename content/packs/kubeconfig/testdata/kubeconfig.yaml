# A practice kubeconfig. Every server, CA and token in it is made up.
apiVersion: v1
kind: Config
current-context: staging
clusters:
  - name: staging
    cluster:
      server: https://staging.k8s.example.com:6443
      certificate-authority-data: bm90IGEgcmVhbCBDQTogc3RhZ2luZw==
  - name: prod-eu-west-1
    cluster:
      server: https://prod-eu-west-1.k8s.example.com:6443
      certificate-authority-data: bm90IGEgcmVhbCBDQTogcHJvZC1ldQ==
  - name: prod-us-east-1
    cluster:
      server: https://prod-us-east-1.k8s.example.com:6443
      certificate-authority-data: bm90IGEgcmVhbCBDQTogcHJvZC11cw==
users:
  - name: alice
    user:
      token: fake-token-alice
  - name: deploy-bot
    user:
      token: fake-token-deploy-bot
contexts:
  - name: staging
    context:
      cluster: staging
      user: alice
      namespace: shop
  - name: prod-eu
    context:
      cluster: prod-eu-west-1
      user: deploy-bot
      namespace: payments
  - name: prod-us
    context:
      cluster: prod-us-east-1
      user: deploy-bot
      namespace: payments
  # The "dev" cluster was torn down, but nobody deleted this context.
  - name: old-dev
    context:
      cluster: dev
      user: alice
