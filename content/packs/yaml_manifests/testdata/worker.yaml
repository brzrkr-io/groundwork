apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: payments
spec:
  # No replicas here: Kubernetes would default to 1.
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: registry.example.com/payments/worker:0.9.3
          ports:
            - containerPort: 9090
