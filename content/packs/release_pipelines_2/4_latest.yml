# Task 4: build the statusd image on every push to main and deploy it.
# In a real repository: .github/workflows/deliver.yml.

name: deliver

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # TODO(4): The review found production running an image nobody had
        # tested: another run pushed in between build and deploy.
        with:
          context: .
          push: true
          tags: ghcr.io/acme/statusd:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TODO(4): This step rolled out whatever :latest pointed to by then.
      - run: ./deploy.sh production ghcr.io/acme/statusd:latest
