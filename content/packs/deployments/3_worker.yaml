# Task 3: this Deployment is already running in the cluster. Change the
# file, then kubectl apply it again.
#
# TODO(3): Scale to 4 replicas, label the Deployment team: payments, and
# label its Pods track: stable, without breaking the next kubectl apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/stefanprodan/podinfo:6.9.2
