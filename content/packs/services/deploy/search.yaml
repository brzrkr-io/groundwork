# The search Deployment that 3_search_service.yaml sends traffic to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: shop
  labels:
    app: search
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          ports:
            - name: http
              containerPort: 9898
