apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:latest
        - name: log-shipper
          image: registry.example.com:5000/ops/shipper
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
