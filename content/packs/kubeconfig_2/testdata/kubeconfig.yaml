# A practice kubeconfig. Every server, CA and token in it is made up.
apiVersion: v1
kind: Config
current-context: dev
clusters:
  - name: dev
    cluster:
      server: https://dev.k8s.example.com:6443
      certificate-authority-data: bm90IGEgcmVhbCBDQTogZGV2
  - name: ci
    cluster:
      server: https://ci.k8s.example.com:6443
      certificate-authority-data: bm90IGEgcmVhbCBDQTogY2k=
  - name: prod-us-east-1
    cluster:
      server: https://prod-us-east-1.k8s.example.com:6443
      certificate-authority-data: bm90IGEgcmVhbCBDQTogcHJvZA==
users:
  - name: dev-team
    user:
      token: fake-token-dev-team
  - name: ci-runner
    user:
      token: fake-token-ci-runner
  - name: release-bot
    user:
      token: fake-token-release-bot
contexts:
  - name: dev
    context:
      cluster: dev
      user: dev-team
      namespace: shop
  - name: ci
    context:
      cluster: ci
      user: ci-runner
  - name: prod
    context:
      cluster: prod-us-east-1
      user: release-bot
      namespace: payments
