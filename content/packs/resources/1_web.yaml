# Task 1: web must be the last thing evicted when a node runs short.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          # TODO(1): Request and limit 250m of CPU and 128Mi of memory, so the
          # Pods get the Guaranteed QoS class.
