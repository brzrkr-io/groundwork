# Task 4: lint statusd, and tell the team's chat when lint fails.
# In a real repository: .github/workflows/lint.yml.

name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # TODO(4): GitHub refuses to start this workflow:
    #   Expected format {org}/{repo}[/path]@ref. Actual 'acme/slack-notify'
    # and the security review flagged the other three steps: each one runs
    # whatever code its owner points that ref at next, or doesn't resolve.
    # Pin every action to a full commit SHA with its release in a comment.
    steps:
      - uses: actions/checkout@3d3c42e
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@master
      - if: failure()
        uses: acme/slack-notify
        with:
          channel: statusd-alerts
