# Task 3: give the web container its settings and the database password.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          ports:
            - name: http
              containerPort: 9898
          # TODO(3): Load every key of the ConfigMap web-config as an
          # environment variable, and set DB_PASSWORD from the key password
          # of the Secret db-credentials.
