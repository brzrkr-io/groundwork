# Task 1: the notes Deployment, as it was applied this morning.
# testdata/incident.txt, parts 1 and 3, shows what went wrong.
#
# TODO(1): Fix the two problems in this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: notes
  labels:
    app: notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
        - name: notes
          image: ghcr.io/stefanprodan/podinfo:6.9.20
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: PODINFO_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: level
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
